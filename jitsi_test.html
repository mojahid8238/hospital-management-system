<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jitsi Test</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
            font-family: sans-serif;
            z-index: 10;
        }
    </style>
    <!--
        IMPORTANT: Adjust the Jitsi server URL below to match your setup.
        This should be the base URL where your Jitsi instance serves its external API.
        e.g., 'http://localhost:8000', 'https://meet.example.com'
    -->
    <script src='http://localhost:8000/libs/external_api.min.js'></script>
    <script>
        // Check if JitsiMeetExternalAPI is defined immediately after script load
        if (typeof JitsiMeetExternalAPI === 'undefined') {
            document.addEventListener('DOMContentLoaded', function() {
                const statusDiv = document.getElementById('status');
                if (statusDiv) {
                    statusDiv.innerHTML = '<span style="color:red">CRITICAL ERROR: JitsiMeetExternalAPI script did not load. Check `http://localhost:8000/libs/external_api.min.js` path and Jitsi server status.</span>';
                }
            });
        }
    </script>
</head>
<body>
    <div id="status">Loading Jitsi Meet...</div>
    <div id="meet" style="height: 100vh; width: 100%;"></div>

    <script>
        const statusDiv = document.getElementById('status');
        window.onload = function() {
            statusDiv.innerHTML = 'API Script Loaded. Checking JitsiMeetExternalAPI...';
            
            // --- Jitsi Configuration (EDIT THESE VALUES FOR YOUR TEST) ---
            const domain = 'localhost:8000'; // Your Jitsi server domain and port
            const roomName = 'test-room-123'; // A unique room name for testing
            const userName = 'Test User';      // Display name in Jitsi
            const userEmail = 'test@example.com'; // User email for Jitsi
            // -------------------------------------------------------------

            statusDiv.innerHTML += '<br>Attempting to connect to Jitsi:<br>Domain: <code>' + domain + '</code><br>Room: <code>' + roomName + '</code><br>User: <code>' + userName + ' (' + userEmail + ')</code>';
            
            if (typeof JitsiMeetExternalAPI === 'undefined') {
                statusDiv.innerHTML = '<span style="color:red">ERROR: JitsiMeetExternalAPI is still undefined after window load. This indicates a problem with loading `external_api.min.js` or its execution. Make sure Jitsi server is running and accessible at ' + domain + '.</span>';
                return;
            }
            
            statusDiv.innerHTML += '<br>JitsiMeetExternalAPI found. Initializing...';
            
            try {
                const options = {
                    roomName: roomName,
                    parentNode: document.querySelector('#meet'),
                    userInfo: {
                        displayName: userName,
                        email: userEmail
                    },
                    configOverwrite: {
                        prejoinPageEnabled: false
                    },
                    interfaceConfigOverwrite: {
                        SHOW_JITSI_WATERMARK: false,
                        SHOW_WATERMARK_FOR_GUESTS: false,
                        SHOW_BRAND_WATERMARK: false,
                        // Add more interface configurations as needed
                    }
                };

                const api = new JitsiMeetExternalAPI(domain, options);
                
                api.addEventListener('videoConferenceJoined', () => {
                    statusDiv.innerHTML = '<span style="color:green">SUCCESS: Joined conference!</span>';
                });
                
                api.addEventListener('readyToClose', () => {
                    statusDiv.innerHTML = 'Conference ended';
                });
                
                setTimeout(() => {
                    if (statusDiv.innerHTML.indexOf('SUCCESS') === -1 && statusDiv.innerHTML.indexOf('ERROR') === -1) {
                        statusDiv.innerHTML += '<br><span style="color:orange">Still connecting... If this persists, check browser console for errors or Jitsi server status at ' + domain + '.</span>';
                    }
                }, 10000); // Increased timeout for better observation
                
            } catch(e) {
                statusDiv.innerHTML = '<span style="color:red">ERROR during Jitsi API initialization: ' + e.message + '. Please ensure the Jitsi server is running and accessible at ' + domain + '.</span>';
                console.error(e);
            }
        };
    </script>
</body>
</html>
