<VirtualHost *:80>
        ServerAdmin webmaster@localhost
        DocumentRoot /var/www/html

        # Proxy Socket.IO to signaling server
        RewriteEngine On
        RewriteCond %{HTTP:Upgrade} =websocket [NC]
        RewriteRule ^/socket.io/(.*) ws://signaling:3000/socket.io/$1 [P,L]

        ProxyPass /socket.io http://signaling:3000/socket.io
        ProxyPassReverse /socket.io http://signaling:3000/socket.io

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>